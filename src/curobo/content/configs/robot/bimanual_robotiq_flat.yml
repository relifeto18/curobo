        right_lbr_link_5: [right_lbr_link_6, right_lbr_link_7, attached_object],
        right_lbr_link_6: [right_lbr_link_7, right_robotiq_to_lbr_mount, right_robotiq_link, attached_object],
        right_lbr_link_7: [right_robotiq_to_lbr_mount, right_robotiq_link, attached_object],
        right_robotiq_to_lbr_mount: [right_robotiq_link, attached_object],
        left_lbr_link_0: [left_lbr_link_1, left_lbr_link_2],
