robot_cfg:
  kinematics:
    usd_path: robot/iiwa_allegro_description/configuration/bimanual_robotiq_flat.usd
    usd_robot_root: "/robot"
    isaac_usd_path: robot/iiwa_allegro_description/configuration/bimanual_robotiq_flat_sim.usd
    usd_flip_joints: {}
    usd_flip_joint_limits: []

    urdf_path: robot/iiwa_allegro_description/bimanual_robotiq_flat.urdf
    asset_root_path: robot/iiwa_allegro_description
    
    base_link: "world"
    ee_link: "left_robotiq_link"
    link_names: ["left_robotiq_link", "right_robotiq_link"]
    lock_joints: null
    extra_links: {"attached_object":{"parent_link_name": "left_robotiq_link", "link_name": "attached_object", 
                  "fixed_transform": [0,0,0,1,0,0,0], "joint_type":"FIXED", "joint_name": "attach_joint"}}
    
    collision_link_names: 
      - world
      - right_lbr_link_0
      - right_lbr_link_1
      - right_lbr_link_2
      - right_lbr_link_3
      - right_lbr_link_4
      - right_lbr_link_5
      - right_lbr_link_6
      - right_lbr_link_7
      - right_robotiq_to_lbr_mount
