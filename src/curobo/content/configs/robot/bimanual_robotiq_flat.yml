      - left_lbr_link_4
      - left_lbr_link_5
      - left_lbr_link_6
      - left_lbr_link_7
      - left_robotiq_to_lbr_mount
      - left_robotiq_link
      - attached_object


    collision_spheres: spheres/bimanual_robotiq.yml 
    collision_sphere_buffer: 0.005 
    extra_collision_spheres: {"attached_object": 10}
    self_collision_ignore: 
      {
        world: [right_lbr_link_0, right_lbr_link_1, right_lbr_link_0, right_lbr_link_1],
        right_lbr_link_0: [right_lbr_link_1, right_lbr_link_2],
